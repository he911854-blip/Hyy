services:
  - type: web
    name: geekflow-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./geekflow-demo.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CLIENT_ORIGIN
        sync: false
