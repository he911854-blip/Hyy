services:
  - type: web
    name: geekflow-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/geekflow.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CLIENT_ORIGIN
        sync: false
    disk:
      name: geekflow-data
      mountPath: /var/data
      sizeGB: 1
